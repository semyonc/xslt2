[package]
name = "xslt2"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["semyonc"]
description = "Schema-aware XSLT 2.0 processor built on the xsd-schema validator and its XPath 2.0 engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/semyonc/xslt2"
documentation = "https://docs.rs/xslt2"
readme = "README.md"
keywords = ["xslt", "xml", "xpath", "transformation", "schema-aware"]
categories = ["parser-implementations", "text-processing"]
# The published package holds the library, its documentation and the
# examples. The tests stay in the repository: the conformance harness needs
# the external W3C XSLT test suite, and the integration tests are development
# checks.
include = [
    "src/**",
    "examples/**",
    "Cargo.toml",
    "README.md",
    "LICENSE-*",
    "CHANGELOG.md",
]

[package.metadata.docs.rs]
# Document the whole public API, including the optional `icu-collation`
# feature.
all-features = true

[dependencies]
# The foundation: the XPath 2.0 engine, the XDM type hierarchy, schema
# validation with its post-schema-validation infoset, and the in-memory
# document model. The `xsd11` feature enables the XPath engine and the
# document model.
xsd-schema = { version = "0.3", features = ["xsd11"] }

# The arena that holds the nodes of documents built during a transformation.
bumpalo = "3"
# Typed keys for the document store.
slotmap = "1.0"
# The regular-expression engine behind `xsl:analyze-string`, `fn:matches`,
# `fn:replace` and `fn:tokenize`: the maintained fork of `regexml`, published
# as `regexml-fork` and renamed back so the code keeps the name `regexml`.
# It is the same requirement as `xsd-schema`'s, so the build has one copy.
regexml = { package = "regexml-fork", version = "0.3" }
# The serialization parameter `normalization-form` (NFC, NFD, NFKC, NFKD).
# `xsd-schema` already depends on it (for `fn:normalize-unicode`) with the same
# requirement, so it adds no build.
unicode-normalization = "0.1"
# The Unicode Collation Algorithm with locale tailorings, behind the optional
# `icu-collation` feature. Pinned to the ICU4X 1.5 line that `regexml` already
# brings, so the feature adds the collator and its data but never a second ICU
# build.
icu_collator = { version = "~1.5", optional = true }
# `DataLocale`, the locale argument of the collator (already a dependency of
# `regexml`'s ICU4X 1.5 crates).
icu_provider = { version = "~1.5", optional = true }
# `Locale`, to read the Unicode extension keywords in the `lang` parameter of a
# UCA collation URI (already a dependency of `regexml`'s ICU4X 1.5 crates).
icu_locid = { version = "~1.5", optional = true }
# The contraction and prefix tries of the collation data and the canonical
# decompositions, which the substring functions (`fn:contains`,
# `fn:starts-with`, `fn:ends-with`, `fn:substring-before` …) read under a UCA
# collation. Both are dependencies of `icu_collator` 1.5 already.
icu_collections = { version = "~1.5", optional = true }
icu_normalizer = { version = "~1.5", optional = true }

[features]
default = []
# ICU collations: the UCA collation URIs
# (`http://www.w3.org/2013/collation/UCA?…`) and the locale-tailored
# `lang` and `case-order` of `xsl:sort`. Without it, the codepoint collation,
# the HTML ASCII case-insensitive collation and the collations a host registers
# are available.
icu-collation = [
    "dep:icu_collator",
    "dep:icu_provider",
    "dep:icu_locid",
    "dep:icu_collections",
    "dep:icu_normalizer",
]

[dev-dependencies]
pretty_assertions = "1.4"
roxmltree = "0.19"           # Reads the catalog of the W3C XSLT test suite

[lib]
name = "xslt2"
path = "src/lib.rs"

# The W3C XSLT conformance harness: the XSLT 2.0 subset of the public XSLT 3.0
# test suite (https://github.com/w3c/xslt30-test), which is not part of this
# repository. Run it in release mode:
#   cargo test --release --test xslts -- -s <path to xslt30-test> --skip unicode-90
# Without `-s` it looks for the suite at `../../xslt30-test` and skips with a
# message when the suite is not there.
[[test]]
name = "xslts"
path = "tests/xslts/driver.rs"
harness = false
