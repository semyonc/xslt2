[package]
name = "xslt2"
version = "0.1.0"
edition = "2021"
authors = ["semyonc"]
description = "Schema-aware XSLT 2.0 processor built on the xsd-schema validator and its XPath 2.0 engine"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["xslt", "xml", "xpath", "transformation", "schema-aware"]
categories = ["parser-implementations", "text-processing"]

[dependencies]
# Foundation: XPath 2.0 engine, XDM type tower, PSVI, BufferDocument.
# The `xsd11` feature is required for the XPath engine and BufferDocument.
xsd-schema = { path = "../xsd-schema", features = ["xsd11"] }

# The transformation arena (§6.1): nodes and the document structs themselves.
bumpalo = "3"
# Typed keys for the document store (DocId).
slotmap = "1.0"
# The regular-expression engine behind xsl:analyze-string (§15). The same
# requirement as xsd-schema's, so the graph keeps one copy and a local
# `[patch.crates-io]` of it applies to both.
regexml = "0.2"
# The Unicode Collation Algorithm with locale tailorings (DESIGN §9.5), behind
# the off-by-default `icu-collation` feature. Pinned to the ICU4X 1.5 line that
# `regexml` already brings (icu_properties, icu_locid, icu_provider …), so the
# feature adds the collator and its data, never a second ICU build.
icu_collator = { version = "~1.5", optional = true }
# `DataLocale`, the locale argument of the collator (already in the graph
# through `regexml`'s ICU4X 1.5 crates: no new build).
icu_provider = { version = "~1.5", optional = true }
# `Locale`, to read the Unicode extension keywords of a UCA URI's `lang` (also
# already in the graph through `regexml`'s ICU4X 1.5 crates).
icu_locid = { version = "~1.5", optional = true }
# The contraction and prefix tries of the collation data (`Char16TrieIterator`)
# and the canonical decompositions, which the substring search of the UCA
# collations reads to tell context-free characters (`collation/uca/search.rs`).
# Both are already in the graph as dependencies of `icu_collator` 1.5: no new
# build.
icu_collections = { version = "~1.5", optional = true }
icu_normalizer = { version = "~1.5", optional = true }

[features]
default = []
# ICU/UCA collations: `http://www.w3.org/2013/collation/UCA?…` and
# locale-tailored `xsl:sort lang` / `case-order` (DESIGN §9.5, milestone M2k).
icu-collation = [
    "dep:icu_collator",
    "dep:icu_provider",
    "dep:icu_locid",
    "dep:icu_collections",
    "dep:icu_normalizer",
]

[dev-dependencies]
pretty_assertions = "1.4"
roxmltree = "0.19"           # W3C test-suite catalog parsing (same as xsd-schema's XQTS driver)

[lib]
name = "xslt2"
path = "src/lib.rs"

# W3C XSLT conformance harness (XSLT 2.0-applicable subset of the public XSLT 3.0 suite).
# Always run in --release:  cargo test --test xslts --release -- -s ../../xslt30-test
[[test]]
name = "xslts"
path = "tests/xslts/driver.rs"
harness = false
